<!doctype html>
<html><head><meta charset="utf-8">
<!-- The link-preview / Google image for studium.nz. Render with: node tools/og/render.mjs  ->  assets/web/og.jpg -->
<style>
@font-face { font-family: Fraunces; src: url(../../assets/fonts/fraunces.woff2) format('woff2'); font-weight: 100 900; }
@font-face { font-family: Geist; src: url(../../assets/fonts/geist.woff2) format('woff2'); font-weight: 100 900; }
html, body { margin: 0; }
body { width: 1200px; height: 630px; overflow: hidden; background: #0c0b0a; color: #f4f1ea; position: relative; font-family: Geist, sans-serif; }
.glow { position: absolute; right: -120px; top: -40px; width: 860px; height: 720px;

.grain { position: absolute; inset: 0; opacity: .10; mix-blend-mode: overlay; }
.cam { position: absolute; right: -30px; top: 52%; width: 580px; transform: translateY(-50%) rotate(-4deg);
  filter: drop-shadow(0 40px 50px rgba(0,0,0,.7)); }
.copy { position: absolute; left: 84px; top: 50%; transform: translateY(-50%); width: 450px; }
h1 { font-family: Fraunces; font-weight: 420; font-size: 118px; letter-spacing: -.02em; line-height: .95; margin: 0 0 28px; }
p { font-size: 25px; line-height: 1.38; color: rgba(244,241,234,.74); margin: 0; font-weight: 380; }
.rule { width: 56px; height: 3px; background: #e3ad57; margin: 0 0 30px; }
.url { position: absolute; left: 84px; bottom: 54px; font-size: 19px; letter-spacing: .14em; text-transform: uppercase; color: #e3ad57; font-weight: 500; }
</style></head>
<body>
  <div class="glow"></div>
  <img class="cam" src="../../assets/camera/front.webp" alt="">
  <div class="copy">
    <h1>Studium</h1>
    <div class="rule"></div>
    <p>Shoot, edit, research and build your folio, all in one place</p>
  </div>
  <div class="url">studium.nz</div>
  <svg class="grain" width="1200" height="630"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</body></html>
